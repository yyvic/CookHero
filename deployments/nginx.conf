server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端 (与前端同 origin，规避硬编码 CORS 白名单)
    location /api/ {
        proxy_pass http://cookhero_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE 流式输出必须关掉缓冲
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /docs {
        proxy_pass http://cookhero_backend:8000/docs;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://cookhero_backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 移动端 PWA（mobile/ 构建产物挂载到 /usr/share/nginx/html/m）
    location = /m {
        return 301 /m/;
    }
    location /m/ {
        try_files $uri $uri/ /m/index.html;
    }
    # Service Worker 与 manifest 不能被缓存，否则前端发版后用户拿不到新版本
    location = /m/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /m/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # 桌面端前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
